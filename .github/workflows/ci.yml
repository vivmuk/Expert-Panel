name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared requirements and pytest
        run: python -m pip install -r requirements.txt pytest
      - name: Run the suite
        run: python -m pytest tests -q --ignore=tests/test_pg_authority.py
        env:
          VENICE_API_KEY: test-not-a-real-key
          SUPERMEMORY_API_KEY: ""
      - name: Run browser-history checks
        run: node tests/test_history.js

  pytest-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: exposure
          POSTGRES_PASSWORD: exposure-test-only
          POSTGRES_DB: exposure_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exposure -d exposure_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared requirements, pytest, and local Postgres tools
        run: |
          python -m pip install -r requirements.txt pytest
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Require an explicit disposable database
        run: |
          test -n "$EXPOSURE_TEST_DATABASE_URL"
          test "$EXPOSURE_PG_REQUIRED" = "1"
        env:
          EXPOSURE_PG_REQUIRED: "1"
          EXPOSURE_TEST_DATABASE_URL: postgresql://exposure:exposure-test-only@127.0.0.1:5432/exposure_test
      - name: Run the Postgres authority tests
        run: |
          python -m pytest tests/test_pg_authority.py -q --junitxml=pg-authority.xml
          python -c "import xml.etree.ElementTree as ET; root=ET.parse('pg-authority.xml').getroot(); suite=root if root.tag=='testsuite' else root.find('testsuite'); skipped=int(suite.attrib.get('skipped',0)); tests=int(suite.attrib.get('tests',0)); failures=int(suite.attrib.get('failures',0)); errors=int(suite.attrib.get('errors',0)); assert skipped==0 and failures==0 and errors==0 and tests>=1, (tests, skipped, failures, errors)"
        env:
          EXPOSURE_PG_REQUIRED: "1"
          EXPOSURE_TEST_DATABASE_URL: postgresql://exposure:exposure-test-only@127.0.0.1:5432/exposure_test
          SUPERMEMORY_API_KEY: ""
