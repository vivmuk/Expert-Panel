name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared requirements and pytest
        run: python -m pip install -r requirements.txt pytest
      - name: Run the suite
        run: python -m pytest tests -q
        env:
          VENICE_API_KEY: test-not-a-real-key
          SUPERMEMORY_API_KEY: ""
      - name: Run browser-history checks
        run: node tests/test_history.js
